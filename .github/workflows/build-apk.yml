name: Build APK Ao Ponto Entregador

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceitar Licenças do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK Debug com Gradle
        run: |
          cd android
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || true

      - name: Salvar Log e APK no Repositorio
        if: always()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git checkout -B build-log
          cp android/build.log ./build.log || true
          find android/ -name "*.apk" -exec cp {} ./AoPonto-Entregador.apk \; || true
          git add -f build.log AoPonto-Entregador.apk || true
          git commit -m "build: resultado compilacao" || true
          git push -f origin build-log || true

      - name: Fazer Upload do Log ou APK Compilado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AoPonto-Entregador-APK
          path: |
            android/build.log
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
