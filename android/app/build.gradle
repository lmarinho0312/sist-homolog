plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.aoponto.motoboy'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.aoponto.motoboy"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
